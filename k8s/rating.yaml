apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rating
  template:
    metadata:
      labels:
        app: rating
    spec:
      containers:
        - name: rating
          image: rating-service
          ports:
            - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
spec:
  selector:
    app: rating
  ports:
    - port: 3003
