apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cakedelight
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cakedelight-notification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq.cakedelight.svc.cluster.local:5672"
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cakedelight
spec:
  selector:
    app: notification-service
  ports:
    - port: 3004
      targetPort: 3004
