apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cakedelight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: notification-service
          ports:
            - containerPort: 3004
          env:
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq.cakedelight.svc.cluster.local:5672"
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cakedelight
spec:
  selector:
    app: notification
  ports:
    - port: 3004
