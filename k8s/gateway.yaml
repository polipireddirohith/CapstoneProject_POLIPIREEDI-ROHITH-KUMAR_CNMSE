apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: api-gateway
          ports:
            - containerPort: 3000
          env:
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:3001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3002"
            - name: RATING_SERVICE_URL
              value: "http://rating-service:3003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3004"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
