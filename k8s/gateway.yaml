apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cakedelight
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: cakedelight-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service.cakedelight.svc.cluster.local:3001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service.cakedelight.svc.cluster.local:3002"
            - name: RATING_SERVICE_URL
              value: "http://rating-service.cakedelight.svc.cluster.local:3003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service.cakedelight.svc.cluster.local:3004"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cakedelight
spec:
  type: NodePort # Allows direct access in Minikube / Kind / Kubernetes clusters
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
