apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cakedelight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: api-gateway
          ports:
            - containerPort: 3000
          env:
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service.cakedelight.svc.cluster.local:3001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service.cakedelight.svc.cluster.local:3002"
            - name: RATING_SERVICE_URL
              value: "http://rating-service.cakedelight.svc.cluster.local:3003"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service.cakedelight.svc.cluster.local:3004"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cakedelight
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
