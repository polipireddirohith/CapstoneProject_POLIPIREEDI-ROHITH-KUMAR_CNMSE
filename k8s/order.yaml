apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cakedelight
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: cakedelight-order:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq.cakedelight.svc.cluster.local:5672"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service.cakedelight.svc.cluster.local:3004"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cakedelight
spec:
  selector:
    app: order-service
  ports:
    - port: 3002
      targetPort: 3002
