<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cake Delight 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }

    header {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.5rem; }

    .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }

    /* ── Filters ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      background: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .filters input, .filters select {
      padding: 7px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    .filters input:focus, .filters select:focus { border-color: #e11d48; }

    /* ── Grid ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

    /* ── Cake Card ── */
    .cake-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cake-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
    .cake-card img { width: 100%; height: 170px; object-fit: cover; }
    .cake-info { padding: 12px 14px; }
    .cake-info h3 { font-size: 1rem; margin-bottom: 4px; }
    .cake-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .cake-id   { font-size: 0.72rem; background: #f1f5f9; color: #64748b; padding: 2px 7px; border-radius: 999px; font-family: monospace; }
    .cake-cat  { font-size: 0.72rem; background: #fdf2f8; color: #be185d; padding: 2px 7px; border-radius: 999px; }
    .cake-price { font-size: 1.1rem; font-weight: 700; color: #e11d48; margin-bottom: 6px; }
    .cake-desc  { font-size: 0.8rem; color: #64748b; margin-bottom: 10px; line-height: 1.4; }
    .cake-actions { display: flex; gap: 8px; }

    /* ── Buttons ── */
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary  { background: #e11d48; color: #fff; flex: 1; }
    .btn-outline  { background: #fff; color: #e11d48; border: 1.5px solid #e11d48; flex: 1; }
    .btn-sm       { padding: 3px 10px; font-size: 0.8rem; background: #e11d48; color: #fff; border-radius: 5px; border: none; cursor: pointer; }

    /* ── Layout panels ── */
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; }
    @media (max-width: 700px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
      padding: 18px 20px;
    }
    .panel h2 { font-size: 1rem; margin-bottom: 14px; color: #e11d48; display: flex; align-items: center; gap: 6px; }

    /* ── Basket ── */
    .basket-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.88rem; }
    .basket-qty  { display: flex; align-items: center; gap: 6px; }
    .basket-qty button { width: 24px; height: 24px; border-radius: 50%; border: none; background: #e11d48; color: #fff; cursor: pointer; font-size: 1rem; line-height: 1; }
    .basket-total { font-weight: 700; margin-top: 10px; font-size: 0.95rem; }
    .basket-empty { color: #94a3b8; font-size: 0.88rem; }

    /* ── Rating ── */
    .rating-form { display: flex; flex-direction: column; gap: 8px; }
    .rating-form label { font-size: 0.82rem; color: #64748b; }
    .rating-form input, .rating-form select, .rating-form textarea {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      font-family: inherit;
    }
    .rating-form input:focus, .rating-form select:focus { border-color: #e11d48; }
    #selected-cake-badge {
      display: inline-block;
      background: #fdf2f8;
      color: #be185d;
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    #rating-result {
      margin-top: 10px;
      background: #f0fdf4;
      color: #15803d;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      display: none;
    }

    /* ── Notifications ── */
    .notif-item {
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.83rem;
      border-left: 3px solid #e11d48;
    }
    .notif-item .notif-subject { font-weight: 600; margin-bottom: 2px; }
    .notif-item .notif-status  { color: #15803d; font-size: 0.75rem; }

    .section-title { font-size: 1.15rem; font-weight: 700; margin: 28px 0 14px; color: #1e293b; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1e293b; color: #fff;
      padding: 10px 18px; border-radius: 8px;
      font-size: 0.88rem; opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <span style="font-size:2rem">🎂</span>
  <h1>Cake Delight — Microservices Demo</h1>
</header>

<div class="container">

  <!-- ── Filters ── -->
  <div class="filters">
    <input id="search"   placeholder="🔍 Search cakes…"  oninput="loadCakes()" style="flex:2;min-width:160px">
    <select id="cat"     onchange="loadCakes()" style="flex:1;min-width:130px">
      <option>All</option>
      <option>Chocolate</option>
      <option>Velvet</option>
      <option>Cheesecake</option>
    </select>
    <input id="maxPrice" placeholder="Max Price ₹" type="number" oninput="loadCakes()" style="flex:1;min-width:120px">
  </div>

  <!-- ── Cake Grid ── -->
  <div class="section-title">🍰 Cake Catalog</div>
  <div class="grid" id="cake-list">
    <div style="color:#94a3b8;font-size:0.9rem">Loading cakes…</div>
  </div>

  <!-- ── Bottom Panels ── -->
  <div class="panels">

    <!-- Basket -->
    <div class="panel">
      <h2>🛒 Shopping Basket</h2>
      <div id="basket-items"><span class="basket-empty">Your basket is empty.</span></div>
      <div class="basket-total" id="basket-total" style="margin-top:12px">Total: ₹0</div>
      <button class="btn btn-primary" style="margin-top:12px;width:100%" onclick="checkout()">✅ Checkout</button>
    </div>

    <!-- Rating -->
    <div class="panel">
      <h2>⭐ Rate a Cake</h2>
      <div id="selected-cake-badge">No cake selected — click "Rate" on a card</div>
      <div class="rating-form">
        <input type="hidden" id="rateCakeId" value="">
        <label>Star Rating</label>
        <select id="rateScore">
          <option value="5">⭐⭐⭐⭐⭐ — 5 Stars</option>
          <option value="4">⭐⭐⭐⭐ — 4 Stars</option>
          <option value="3">⭐⭐⭐ — 3 Stars</option>
          <option value="2">⭐⭐ — 2 Stars</option>
          <option value="1">⭐ — 1 Star</option>
        </select>
        <label>Your Name</label>
        <input id="reviewerName" placeholder="Enter your name">
        <label>Comment</label>
        <input id="reviewComment" placeholder="Write a short review…">
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-primary" onclick="submitRating()">Submit Rating</button>
          <button class="btn btn-outline"  onclick="checkRating()">View Average</button>
        </div>
      </div>
      <div id="rating-result"></div>
    </div>

  </div>

  <!-- Notifications -->
  <div class="panel" style="margin-top:20px">
    <h2>🔔 Notifications
      <button class="btn-sm" onclick="loadNotes()" style="margin-left:auto">Refresh</button>
    </h2>
    <div id="notifications-list"><span class="basket-empty">No notifications yet. Place an order!</span></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const BASE = '/api';

  async function fetchJSON(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : null
    });
    return res.json();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ── Catalog ──
  async function loadCakes() {
    const name     = encodeURIComponent(document.getElementById('search').value);
    const category = encodeURIComponent(document.getElementById('cat').value);
    const maxPrice = document.getElementById('maxPrice').value;
    let url = `${BASE}/catalog/cakes?name=${name}&category=${category}`;
    if (maxPrice) url += `&maxPrice=${maxPrice}`;

    const cakes = await fetchJSON('GET', url);
    document.getElementById('cake-list').innerHTML = cakes.length
      ? cakes.map(c => `
          <div class="cake-card">
            <img src="${c.image || 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300'}"
                 alt="${c.name}" onerror="this.src='https://via.placeholder.com/300x170?text=🎂'">
            <div class="cake-info">
              <div class="cake-meta">
                <span class="cake-id">ID: ${c.id}</span>
                <span class="cake-cat">${c.category}</span>
              </div>
              <h3>${c.name}</h3>
              <div class="cake-price">₹${c.price}</div>
              <div class="cake-desc">${c.description || ''}</div>
              <div class="cake-actions">
                <button class="btn btn-primary" onclick="add('${c.id}','${c.name}',${c.price})">🛒 Add to Basket</button>
                <button class="btn btn-outline"  onclick="selectForRating('${c.id}','${c.name}')">⭐ Rate</button>
              </div>
            </div>
          </div>`).join('')
      : '<div style="color:#94a3b8;font-size:0.9rem">No cakes found.</div>';
  }

  // ── Basket ──
  async function add(id, name, price) {
    await fetchJSON('POST', `${BASE}/order/basket/items`, { cakeId: id, name, price, quantity: 1 });
    showToast(`✅ ${name} added to basket!`);
    loadBasket();
  }

  async function loadBasket() {
    const d = await fetchJSON('GET', `${BASE}/order/basket`);
    document.getElementById('basket-items').innerHTML = d.items && d.items.length
      ? d.items.map(i => `
          <div class="basket-item">
            <span><b>${i.name}</b> <small style="color:#94a3b8">(${i.cakeId})</small></span>
            <div class="basket-qty">
              <button onclick="chg('${i.cakeId}',${i.quantity - 1})">−</button>
              <span>x${i.quantity}</span>
              <button onclick="chg('${i.cakeId}',${i.quantity + 1})">+</button>
            </div>
          </div>`).join('')
      : '<span class="basket-empty">Your basket is empty.</span>';
    document.getElementById('basket-total').innerHTML =
      `<div>Subtotal: ₹${d.summary?.subtotal || 0}</div>
       <div>Delivery: ₹${d.summary?.deliveryFee || 0}</div>
       <div style="font-size:1rem;color:#e11d48">Grand Total: ₹${d.summary?.total || 0}</div>`;
  }

  async function chg(id, qty) {
    await fetchJSON('PUT', `${BASE}/order/basket/items/${id}`, { quantity: qty });
    loadBasket();
  }

  async function checkout() {
    const name = prompt('Enter your name for the order:', 'Rohith Kumar') || 'Customer';
    const email = prompt('Enter your email:', 'customer@example.com') || 'customer@example.com';
    const o = await fetchJSON('POST', `${BASE}/order/checkout`, { customerName: name, email });
    if (o.order) {
      showToast(`🎉 Order ${o.order.orderId} confirmed! Total ₹${o.order.total}`);
      loadBasket();
      setTimeout(loadNotes, 800);
    } else {
      showToast('❌ ' + (o.error || 'Checkout failed'));
    }
  }

  // ── Rating ──
  function selectForRating(cakeId, cakeName) {
    document.getElementById('rateCakeId').value = cakeId;
    document.getElementById('selected-cake-badge').textContent = `Rating: ${cakeName} (${cakeId})`;
    document.getElementById('rating-result').style.display = 'none';
    document.querySelector('.panel:last-of-type') ;
    // Scroll to rating panel
    document.getElementById('rateCakeId').closest('.panel')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function submitRating() {
    const id      = document.getElementById('rateCakeId').value || 'c1';
    const score   = document.getElementById('rateScore').value;
    const name    = document.getElementById('reviewerName').value || 'Anonymous';
    const comment = document.getElementById('reviewComment').value || '';
    await fetchJSON('POST', `${BASE}/rating/ratings`, { cakeId: id, rating: Number(score), customerName: name, comment });
    showToast('⭐ Rating submitted!');
    checkRating();
  }

  async function checkRating() {
    const id = document.getElementById('rateCakeId').value || 'c1';
    const r  = await fetchJSON('GET', `${BASE}/rating/ratings/${id}`);
    const el = document.getElementById('rating-result');
    el.style.display = 'block';
    el.innerHTML = `⭐ Average: <b>${r.averageRating}</b> stars &nbsp;|&nbsp; ${r.totalReviews} review(s) for cake <code>${r.cakeId}</code>`;
  }

  // ── Notifications ──
  async function loadNotes() {
    const notes = await fetchJSON('GET', `${BASE}/notification/notifications`);
    document.getElementById('notifications-list').innerHTML = notes.length
      ? notes.map(v => `
          <div class="notif-item">
            <div class="notif-subject">${v.subject || 'Notification'}</div>
            <div>${v.message || ''}</div>
            <div class="notif-status">✅ ${v.status} &nbsp;·&nbsp; ${v.time || ''}</div>
          </div>`).join('')
      : '<span class="basket-empty">No notifications yet. Place an order!</span>';
  }

  // ── Init ──
  loadCakes();
  loadBasket();
  loadNotes();
</script>
</body>
</html>
