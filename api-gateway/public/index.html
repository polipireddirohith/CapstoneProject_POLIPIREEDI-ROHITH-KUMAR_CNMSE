<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Cake Delight</title>
<style>
  /* Reset & base */
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body { background: #f8fafc; padding: 16px; }

  /* Header bar */
  header { background: #e11d48; color: #fff; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; }

  /* Filter row & card grid */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .grid    { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 16px; }
  input, select { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .85rem; }

  /* Cake card */
  .card      { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .card-body { padding: 10px; }
  .badge     { font-size: .7rem; background: #f1f5f9; color: #64748b; padding: 2px 6px; border-radius: 999px; font-family: monospace; }
  .price     { font-weight: 700; color: #e11d48; margin: 4px 0; }
  .row       { display: flex; gap: 6px; margin-top: 6px; }

  /* Bottom panels */
  .panels    { display: flex; gap: 10px; flex-wrap: wrap; }
  .panel     { flex: 1; min-width: 260px; background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .panel h3  { color: #e11d48; margin-bottom: 10px; }

  /* Basket rows */
  .bitem { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f1f5f9; font-size: .85rem; }
  .bqty  { display: flex; align-items: center; gap: 5px; }

  /* Buttons */
  button  { padding: 5px 12px; background: #e11d48; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: .82rem; }
  .btn-o  { background: #fff; color: #e11d48; border: 1.5px solid #e11d48; }

  /* Notification card */
  .notif { background: #f8fafc; border-left: 3px solid #e11d48; padding: 7px 10px; border-radius: 4px; margin-bottom: 5px; font-size: .82rem; }

  /* Rating result box */
  #rating-result { margin-top: 8px; background: #f0fdf4; color: #15803d; padding: 7px; border-radius: 6px; font-size: .82rem; display: none; }

  /* Selected cake badge */
  #selected { font-size: .78rem; background: #fdf2f8; color: #be185d; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; display: inline-block; }
</style></head><body>
<header><h2>🎂 Cake Delight</h2></header>

<div class="filters">
  <input id="search" placeholder="🔍 Search" oninput="loadCakes()">
  <select id="cat" onchange="loadCakes()"><option>All</option><option>Chocolate</option><option>Velvet</option><option>Cheesecake</option></select>
  <input id="maxPrice" placeholder="Max ₹" type="number" oninput="loadCakes()" style="width:90px">
</div>

<div class="grid" id="cake-list">Loading…</div>

<div class="panels">
  <div class="panel">
    <h3>🛒 Basket</h3>
    <div id="basket-items"><small style="color:#94a3b8">Empty</small></div>
    <div id="basket-total" style="font-weight:700;margin-top:8px">Total: ₹0</div>
    <button style="margin-top:10px;width:100%" onclick="checkout()">✅ Checkout</button>
  </div>
  <div class="panel">
    <h3>⭐ Rate a Cake</h3>
    <div id="selected">No cake selected — click ⭐ Rate on a card</div>
    <input type="hidden" id="rateCakeId">
    <div style="display:flex;flex-direction:column;gap:7px">
      <select id="rateScore"><option value="5">⭐⭐⭐⭐⭐ 5 Stars</option><option value="4">⭐⭐⭐⭐ 4 Stars</option><option value="3">⭐⭐⭐ 3 Stars</option><option value="2">⭐⭐ 2 Stars</option><option value="1">⭐ 1 Star</option></select>
      <input id="reviewerName" placeholder="Your name">
      <input id="reviewComment" placeholder="Comment">
      <div class="row"><button onclick="submitRating()">Submit</button><button class="btn-o" onclick="checkRating()">View Avg</button></div>
    </div>
    <div id="rating-result"></div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">🔔 Notifications</h3>
      <button type="button" onclick="loadNotes()" style="padding:4px 10px;font-size:.78rem">🔄 Refresh</button>
    </div>
    <div id="notifications-list"><small style="color:#94a3b8">Loading…</small></div>
  </div>
</div>

<script>
const B='/api';
const $=id=>document.getElementById(id);
const get=(p)=>fetch(B+p,{cache:'no-store'}).then(r=>r.json());
const post=(p,b)=>fetch(B+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const put=(p,b)=>fetch(B+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());

async function loadCakes(){
  const q=`/catalog/cakes?name=${encodeURIComponent($('search').value)}&category=${encodeURIComponent($('cat').value)}${$('maxPrice').value?'&maxPrice='+$('maxPrice').value:''}`;
  const cakes=await get(q);
  $('cake-list').innerHTML=cakes.map(c=>`
    <div class="card">
      <div class="card-body">
        <span class="badge">ID: ${c.id}</span> <span class="badge">${c.category}</span>
        <div class="price">₹${c.price}</div>
        <b>${c.name}</b>
        <div class="row">
          <button onclick="add('${c.id}','${c.name}',${c.price})">🛒 Add</button>
          <button class="btn-o" onclick="rate('${c.id}','${c.name}')">⭐ Rate</button>
        </div>
      </div>
    </div>`).join('');
}

async function add(id,name,price){await post('/order/basket/items',{cakeId:id,name,price,quantity:1});loadBasket();}
async function loadBasket(){
  const d=await get('/order/basket');
  $('basket-items').innerHTML=d.items?.length?d.items.map(i=>`<div class="bitem"><span><b>${i.name}</b> <small style="color:#94a3b8">(${i.cakeId})</small></span><div class="bqty"><button onclick="chg('${i.cakeId}',${i.quantity-1})">−</button>x${i.quantity}<button onclick="chg('${i.cakeId}',${i.quantity+1})">+</button></div></div>`).join(''):'<small style="color:#94a3b8">Empty</small>';
  $('basket-total').innerHTML=`Subtotal ₹${d.summary?.subtotal||0} + Delivery ₹${d.summary?.deliveryFee||0} = <span style="color:#e11d48">₹${d.summary?.total||0}</span>`;
}
async function chg(id,q){await put(`/order/basket/items/${id}`,{quantity:q});loadBasket();}
async function checkout(){
  const name=prompt('Your name:','Rohith Kumar')||'Customer';
  const email=prompt('Your email:','customer@example.com')||'customer@example.com';
  const o=await post('/order/checkout',{customerName:name,email});
  o.order?alert(`✅ Order ${o.order.orderId} confirmed! ₹${o.order.total}`):alert('❌ '+(o.error||'Failed'));
  loadBasket();setTimeout(loadNotes,800);
}

function rate(id,name){$('rateCakeId').value=id;$('selected').textContent=`Rating: ${name} (${id})`;$('rating-result').style.display='none';}
async function submitRating(){
  const id=$('rateCakeId').value||'c1';
  await post('/rating/ratings',{cakeId:id,rating:Number($('rateScore').value),customerName:$('reviewerName').value||'Guest',comment:$('reviewComment').value||''});
  checkRating();
}
async function checkRating(){
  const id=$('rateCakeId').value||'c1';
  const r=await get(`/rating/ratings/${id}`);
  $('rating-result').style.display='block';
  $('rating-result').innerHTML=`⭐ Avg: <b>${r.averageRating}</b> | ${r.totalReviews} review(s) for <code>${r.cakeId}</code>`;
}

async function loadNotes(){
  try {
    const n = await get('/notification/notifications');
    $('notifications-list').innerHTML = (Array.isArray(n) && n.length)
      ? n.map(v => `
          <div class="notif">
            <b>${v.subject || 'Order Confirmed'}</b>
            ${v.message ? `<div style="margin:2px 0;color:#334155">${v.message}</div>` : ''}
            <div style="font-size:0.75rem;color:#64748b;margin-top:2px">
              <span style="color:#15803d;font-weight:600">✅ ${v.status}</span> &nbsp;•&nbsp; 
              <span>${v.time || ''}</span> &nbsp;•&nbsp; 
              <code style="background:#f1f5f9;padding:1px 4px;border-radius:3px">${v.orderId || ''}</code>
            </div>
          </div>`).join('')
      : '<small style="color:#94a3b8">No notifications yet. Place an order to see confirmation events!</small>';
  } catch (err) {
    $('notifications-list').innerHTML = '<small style="color:#e11d48">Error loading notifications.</small>';
  }
}

loadCakes();loadBasket();loadNotes();
</script>
</body></html>
