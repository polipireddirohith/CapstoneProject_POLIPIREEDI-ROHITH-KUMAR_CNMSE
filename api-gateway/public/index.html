<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Cake Delight</title>
<style>
body{font-family:sans-serif;margin:0;padding:20px;background:#f8fafc;}
header{background:#e11d48;color:#fff;padding:10px 20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.card{background:#fff;padding:12px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
button{background:#e11d48;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;}
.item{display:flex;justify-content:space-between;align-items:center;margin:5px 0;}
</style></head><body>
<header><h1>🎂 Cake Delight</h1></header>
<div class="grid">
  <div class="card"><h3>Catalog</h3>
    <input id="search" placeholder="Search…" oninput="loadCakes()">
    <select id="cat" onchange="loadCakes()"><option>All</option><option>Chocolate</option><option>Velvet</option><option>Cheesecake</option></select>
    <input id="maxPrice" placeholder="Max ₹" type="number" oninput="loadCakes()">
    <div id="cake-list">Loading…</div>
  </div>
  <div class="card"><h3>Basket</h3>
    <div id="basket-items">Empty</div>
    <div id="basket-total">Total: ₹0</div>
    <button onclick="checkout()">Checkout</button>
  </div>
  <div class="card"><h3>Rating</h3>
    <input id="rateCakeId" placeholder="Cake ID" size="4">
    <select id="rateScore"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
    <button onclick="submitRating()">Submit</button>
    <button onclick="checkRating()">Avg</button>
    <div id="rating-result"></div>
  </div>
  <div class="card"><h3>Notifications</h3>
    <button onclick="loadNotes()">Refresh</button>
    <div id="notifications-list"></div>
  </div>
</div>
<script>
const BASE='/api';
async function fetchJSON(m,p,b){return fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):null}).then(r=>r.json());}
async function loadCakes(){let q=`/catalog/cakes?name=${encodeURIComponent(document.getElementById('search').value)}&category=${encodeURIComponent(document.getElementById('cat').value)}${document.getElementById('maxPrice').value?'&maxPrice='+document.getElementById('maxPrice').value:''}`;let data=await fetchJSON('GET',BASE+q);document.getElementById('cake-list').innerHTML=data.map(c=>`<div class="item"><b>${c.name}</b> ₹${c.price}<button onclick="add('${c.id}','${c.name}',${c.price})">+</button></div>`).join('');}
async function add(id,n,p){await fetchJSON('POST',BASE+'/order/basket/items',{cakeId:id,name:n,price:p,quantity:1});loadBasket();}
async function loadBasket(){let d=await fetchJSON('GET',BASE+'/order/basket');let html=d.items.map(i=>`<div class="item"><b>${i.name}</b> x${i.quantity} <button onclick="chg('${i.cakeId}',${i.quantity-1})">‑</button> <button onclick="chg('${i.cakeId}',${i.quantity+1})">+</button></div>`).join('')||'Empty';document.getElementById('basket-items').innerHTML=html;document.getElementById('basket-total').textContent='Total: ₹'+(d.summary?.total||0);}
async function chg(id,q){await fetchJSON('PUT',BASE+`/order/basket/items/${id}`,{quantity:q});loadBasket();}
async function checkout(){let o=await fetchJSON('POST',BASE+'/order/checkout',{customerName:'Demo'});alert('Order '+o.order.orderId+' OK');loadBasket();loadNotes();}
async function submitRating(){let id=document.getElementById('rateCakeId').value||'c1';let s=document.getElementById('rateScore').value;await fetchJSON('POST',BASE+'/rating/ratings',{cakeId:id,rating:s,customerName:'Demo'});checkRating();}
async function checkRating(){let id=document.getElementById('rateCakeId').value||'c1';let r=await fetchJSON('GET',BASE+`/rating/ratings/${id}`);document.getElementById('rating-result').textContent=`Avg ${r.averageRating} (${r.totalReviews})`;}
async function loadNotes(){let n=await fetchJSON('GET',BASE+'/notification/notifications');document.getElementById('notifications-list').innerHTML=n.map(v=>`<div>${v.subject||'Note'} – ${v.status}</div>`).join('');}
loadCakes(); loadBasket(); loadNotes();
</script></body></html>
